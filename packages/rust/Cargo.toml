[workspace]
resolver = "2"
members = ["core", "cli"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
aes-gcm = "0.11.1"
base64 = "0.23"
hex = "0.4"
hkdf = "0.13"
hmac = "0.13"
mime_guess = "2.0"
pbkdf2 = "0.13"
rand = "0.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
swcrypts-core = { path = "core" }
walkdir = "2"

[profile.release]
codegen-units = 1
lto = "fat"
