name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-lib:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build wrapper assets
        run: bun run --cwd packages/lib build

      - name: Run lib tests
        run: bun test --cwd packages/lib

  test-cli:
    runs-on: ubuntu-latest
    needs: test-lib
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build wrapper assets
        run: bun run --cwd packages/lib build

      - name: Run CLI tests
        run: bun test --cwd packages/cli
