name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "packages/lib/**"
      - "packages/cli/**"
      - "packages/site/**"
      - ".github/workflows/deploy.yml"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deploy at a time; cancel any in-progress run if a new one starts
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run --cwd packages/site -b build

      - name: Build SwCrypts lib
        run: bun run --cwd packages/lib build

      - name: Build SwCrypts CLI
        run: bun run --cwd packages/cli build

      - name: Encrypt demo part of site
        run: |
          bun run --cwd packages/cli . build \
            -i ../site/dist/demo \
            -o ../site/dist-enc/demo
          rm -rf packages/site/dist/demo
          mv packages/site/dist-enc/demo packages/site/dist/demo
          rm -rf packages/site/dist-enc

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
